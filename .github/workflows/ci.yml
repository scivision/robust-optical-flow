name: ci

on:
  push:
    paths:
      - "**/CMakeLists.txt"
      - "**.py"
      - "**.m"
      - "**.c"
      - ".github/workflows/ci.yml"


jobs:

  linux:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.9'

    - run: pip install -e .

    - run: cmake -B build

    - run: cmake --build build

    - run: ctest --test-dir build -V
